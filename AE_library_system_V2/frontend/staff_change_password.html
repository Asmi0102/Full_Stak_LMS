<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"><meta content="width=device-width,initial-scale=1.0" name="viewport">
  <title>Change Password | AE Library</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
    body{font-family:Inter,sans-serif;background:#f7fafc}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-blue-50">

  <div class="w-full max-w-md mx-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <!-- Header -->
      <div class="bg-[#002045] px-8 py-8 text-white text-center">
        <div class="w-14 h-14 bg-amber-400/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-300/30">
          <span class="material-symbols-outlined text-amber-300 text-3xl">lock_reset</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">First Login</h1>
        <p class="text-blue-200 text-sm mt-1">You must set a new password before continuing.</p>
      </div>

      <!-- Notice band -->
      <div class="bg-amber-50 border-b border-amber-200 px-6 py-3 flex items-center gap-3">
        <span class="material-symbols-outlined text-amber-600 text-base">warning</span>
        <p class="text-amber-800 text-sm font-medium">
          This is a security requirement. Your temporary password was set by the admin.
        </p>
      </div>

      <!-- Form -->
      <div class="px-8 py-8">
        <div id="error-banner" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span>
          <span id="error-msg">Error</span>
        </div>
        <div id="success-banner" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm flex items-center gap-2">
          <span class="material-symbols-outlined text-base">check_circle</span>
          <span>Password changed! Redirecting…</span>
        </div>

        <form onsubmit="handleChange(event)" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">New Password *</label>
            <input id="new-pwd" type="password" required placeholder="Minimum 6 characters"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 transition-all outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Confirm New Password *</label>
            <input id="confirm-pwd" type="password" required placeholder="Repeat new password"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 transition-all outline-none">
          </div>
          <button type="submit" id="submit-btn"
            class="w-full py-3.5 bg-[#002045] text-white rounded-xl font-semibold hover:opacity-90 transition-all active:scale-95 flex items-center justify-center gap-2 mt-2">
            <span class="material-symbols-outlined text-lg">lock</span>Set New Password
          </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
          Logged in as <strong id="user-display" class="text-slate-600">—</strong>
        </p>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // Guard: if not a first-login session, redirect
    if (!sessionStorage.getItem('ae_first_login')) {
      window.location.href = sessionStorage.getItem('ae_staff_id')
        ? 'staff_dashboard.html' : 'staff_login.html';
    }

    const staffId = parseInt(sessionStorage.getItem('ae_staff_id') || '0');
    document.getElementById('user-display').textContent =
      sessionStorage.getItem('ae_user') || 'Unknown';

    async function handleChange(e) {
      e.preventDefault();
      const newPwd  = document.getElementById('new-pwd').value;
      const confPwd = document.getElementById('confirm-pwd').value;
      const errBanner = document.getElementById('error-banner');
      const errMsg    = document.getElementById('error-msg');
      const btn       = document.getElementById('submit-btn');

      errBanner.classList.add('hidden');

      if (newPwd.length < 6) {
        errMsg.textContent = 'Password must be at least 6 characters.';
        errBanner.classList.remove('hidden'); return;
      }
      if (newPwd !== confPwd) {
        errMsg.textContent = 'Passwords do not match.';
        errBanner.classList.remove('hidden'); return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-lg">progress_activity</span>Saving…';

      try {
        // 1. Update password
        const res = await StaffProfileAPI.update({
          staff_id: staffId,
          email: sessionStorage.getItem('ae_email') || '',
          new_password: newPwd
        });

        if (!res.success) {
          errMsg.textContent = res.message || 'Failed to update password.';
          errBanner.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-lg">lock</span>Set New Password';
          return;
        }

        // 2. Clear first_login flag in DB
        await StaffProfileAPI.clearFirstLogin(staffId);

        // 3. Clear flag from session and redirect
        sessionStorage.removeItem('ae_first_login');
        document.getElementById('success-banner').classList.remove('hidden');
        setTimeout(() => { window.location.href = 'staff_dashboard.html'; }, 1500);

      } catch(err) {
        errMsg.textContent = 'Server error. Is library_server.exe running?';
        errBanner.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">lock</span>Set New Password';
      }
    }
  </script>
</body>
</html>
