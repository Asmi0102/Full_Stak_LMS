<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>AE Library — Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; }
    body { font-family:'Inter',sans-serif; background:#f7fafc; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-blue-50">
  <div class="w-full max-w-md mx-4">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <!-- Header band -->
      <div id="login-header" class="bg-[#002045] px-8 py-8 text-white text-center">
        <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
          <span id="role-icon" class="material-symbols-outlined text-3xl">menu_book</span>
        </div>
        <h1 class="text-2xl font-bold font-manrope tracking-tight" id="login-title">Staff Portal</h1>
        <p class="text-blue-200 text-sm mt-1" id="login-subtitle">Sign in to access the library management system</p>
      </div>
      <!-- Form -->
      <div class="px-8 py-8">
        <div id="error-banner" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span>
          <span id="error-msg">Invalid credentials</span>
        </div>
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Username</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
              <input id="username" type="text" required placeholder="Enter your username"
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 transition-all outline-none">
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
              <input id="password" type="password" required placeholder="Enter your password"
                class="w-full pl-10 pr-16 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-900/20 focus:border-blue-900 transition-all outline-none">
              <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <span id="pwd-eye" class="material-symbols-outlined text-xl">visibility</span>
              </button>
            </div>
          </div>
          <button type="submit" id="login-btn"
            class="w-full py-3.5 bg-[#002045] text-white rounded-xl font-semibold hover:bg-[#002141] transition-all active:scale-95 flex items-center justify-center gap-2 shadow-sm shadow-blue-900/20">
            <span class="material-symbols-outlined text-lg">login</span>
            Sign In
          </button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-6">
          <a href="index.html" class="hover:text-blue-700 transition-colors flex items-center justify-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Portal
          </a>
        </p>
      </div>
    </div>
    <p class="text-center text-xs text-slate-400 mt-4">AE Library Management System · © 2024</p>
  </div>

  <script>
  // ── Staff Login — validates against backend /staff/login ──────────────────
  // Supports any librarian account created by admin via Staff Management page.
  // Default: staff / staff123 (seeded in DB on first run)

  let API_BASE = 'http://localhost:8080';

  // Detect backend port before login attempt
  const portReady = (async () => {
    for (const port of [8080, 8081, 8082, 8083]) {
      try {
        const res = await fetch(`http://localhost:${port}/settings`,
          { signal: AbortSignal.timeout(800) });
        if (res.ok) { API_BASE = `http://localhost:${port}`; return; }
      } catch(e) {}
    }
  })();

  function togglePwd() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('pwd-eye');
    if (inp.type === 'password') { inp.type = 'text'; eye.textContent = 'visibility_off'; }
    else { inp.type = 'password'; eye.textContent = 'visibility'; }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const u      = document.getElementById('username').value.trim();
    const p      = document.getElementById('password').value;
    const banner = document.getElementById('error-banner');
    const btn    = document.getElementById('login-btn');

    if (!u || !p) {
      document.getElementById('error-msg').textContent = 'Please enter username and password.';
      banner.classList.remove('hidden'); return;
    }

    // Show loading state
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin">progress_activity</span>Signing in…';

    try {
      await portReady;
      const res = await fetch(API_BASE + '/staff/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();

      if (data.success) {
        // Only librarian role can access Staff Portal
        if (data.role === 'admin') {
          document.getElementById('error-msg').textContent = 'Admin accounts use the Admin Portal.';
          banner.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span>Sign In';
          document.getElementById('password').value = '';
          return;
        }
        banner.classList.add('hidden');
        sessionStorage.setItem('ae_role', 'staff');
        sessionStorage.setItem('ae_user', data.name || u);
        sessionStorage.setItem('ae_username', data.username || u);
        window.location.href = 'staff_dashboard.html';
      } else {
        document.getElementById('error-msg').textContent = data.message || 'Invalid credentials.';
        banner.classList.remove('hidden');
        document.getElementById('password').value = '';
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span>Sign In';
      }
    } catch(err) {
      document.getElementById('error-msg').textContent = 'Cannot reach server. Is library_server.exe running?';
      banner.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span>Sign In';
    }
  }
</script>
</body>
</html>
